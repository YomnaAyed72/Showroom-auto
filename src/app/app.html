<app-head-bar></app-head-bar>
<app-search-bar [autos]="autoList" (onSelectCar)="selectCar($event)"></app-search-bar>

@if (selectedCar) {
  <div class="overlay">
    <div class="modal">
      <button class="close" (click)="closeDetail()">✕</button>
      <img [src]="`photos/${selectedCar.photo}`" [alt]="selectedCar.model">
      <div class="modal-body">
        <h2>{{ selectedCar.brand }} {{ selectedCar.model }}</h2>
        <p class="meta">{{ selectedCar.power }} HP · {{ selectedCar.price }},000 TND</p>
        <p>{{ selectedCar.description }}</p>
      </div>
    </div>
  </div>
}
